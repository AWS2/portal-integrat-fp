{% extends 'base.html' %}


{% block content %}

  <div class="container">
    <div class="section">
	  <h2>Vídeos dels projectes Scrum</h2>

	  <div class="row">
	  {% for equip in equips %}
	    <div class="col s12 m6 l4">
	      <div class="card blue-grey darken-1">
	        <div class="card-content white-text">
	          <span class="card-title">Equip {{equip}}</span>
	          <p>Projecte {{equip.projecte}}</p>
	          <iframe width="100%" src="https://www.youtube.com/embed/xe2jmwfza2Y?si=3LFs-1pY0FBMi1n5" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
	        </div>
	        <div class="card-action">
	          <a href="/scrum/projecte/{{equip.projecte.id}}">Veure specs del projecte</a>
	        </div>
	      </div>
	    </div>
	  {% endfor %}
	  </div>

	</div>
</div>

{% endblock %}
